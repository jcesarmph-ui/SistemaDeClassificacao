# Norma de tolerância FICTÍCIA para os testes — exemplo do formato de dados/tolerancias/*.yaml.
codigo: NBR 0000-T
titulo: Tolerâncias fictícias

# L ≤ 1200 | 1200 < L ≤ 1500 | L > 1500
larguras: [1200, 1500]

tabelas:
  - nome: Tabela 1
    le_min: {max: 260}                                  # LE mín do grau ≤ 260 MPa
    linhas:
      - {espessura: {max: 0.40}, tolerancias: [0.04, 0.05, null]}       # null = "–" na norma
      - {espessura: {min: 0.40, min_inclusivo: false, max: 0.80}, tolerancias: [0.05, 0.06, 0.07]}
  - nome: Tabela 2
    le_min: {min: 260, min_inclusivo: false, max: 360, max_inclusivo: false}
    linhas:
      - {espessura: {max: 0.40}, tolerancias: [0.05, 0.06, 0.07]}
      - {espessura: {min: 0.40, min_inclusivo: false, max: 0.80}, tolerancias: [0.06, 0.07, 0.08]}

acrescimos:
  - {acabamentos: [GI ZN, GI ZM, GA ZF], camada_min: 275, valor: 0.01}
